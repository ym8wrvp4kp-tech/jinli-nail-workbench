    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #C4A89A;
            --primary-light: #D4B5A8;
            --primary-dark: #A88B7C;
            --primary-bg: #F5EDE8;
            --accent: #E8D5CA;
            --text-primary: #3D2B1F;
            --text-secondary: #7A6B5F;
            --text-light: #A89B8E;
            --bg-white: #FFFFFF;
            --bg-light: #FAF7F5;
            --border: #E8DDD6;
            --shadow: rgba(61, 43, 31, 0.08);
            --success: #8FAE8F;
            --warning: #D4A574;
            --danger: #C98B8B;
            --sidebar-width: 260px;
            --sidebar-collapsed: 0px;
            --header-height: 60px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* App Container */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: linear-gradient(180deg, #FAF7F5 0%, #F0E8E2 100%);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 2px;
        }

        .sidebar-brand {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-brand .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(196, 168, 154, 0.3);
        }

        .sidebar-brand .brand-text {
            flex: 1;
        }

        .sidebar-brand .brand-text .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .sidebar-brand .brand-text .subtitle {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
            letter-spacing: 1.5px;
        }

        .sidebar-home-btn {
            margin: 12px 16px;
            padding: 10px 16px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-home-btn:hover {
            background: var(--primary-bg);
            border-color: var(--primary-light);
        }

        .sidebar-home-btn i {
            font-size: 14px;
        }

        .nav-section {
            padding: 8px 0;
        }

        .nav-section-title {
            padding: 8px 20px 4px;
            font-size: 11px;
            color: var(--text-light);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            margin: 2px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .nav-item:hover {
            background: rgba(196, 168, 154, 0.1);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 2px 8px rgba(196, 168, 154, 0.3);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-light);
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-light);
        }

        /* Header */
        .header {
            height: var(--header-height);
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-back {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            background: var(--bg-white);
            transition: all 0.2s;
        }

        .header-back:hover {
            background: var(--primary-bg);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-white);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .header-actions button:hover {
            background: var(--primary-bg);
        }

        .header-actions button.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
        }

        .header-actions button.primary:hover {
            opacity: 0.9;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }

        /* Cards */
        .card {
            background: var(--bg-white);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            padding: 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-white);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .stat-card:hover {
            box-shadow: 0 4px 16px var(--shadow);
            transform: translateY(-2px);
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .stat-sub {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Quick Actions */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .quick-action-item {
            background: var(--bg-white);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-action-item:hover {
            box-shadow: 0 4px 16px var(--shadow);
            transform: translateY(-2px);
        }

        .quick-action-item .icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 20px;
            color: white;
        }

        .quick-action-item .icon.icon-pink {
            background: linear-gradient(135deg, #D4A5A5, #C98B8B);
        }

        .quick-action-item .icon.icon-brown {
            background: linear-gradient(135deg, #B8A088, #A08B6D);
        }

        .quick-action-item .icon.icon-green {
            background: linear-gradient(135deg, #A5C4A5, #8FAE8F);
        }

        .quick-action-item .icon.icon-blue {
            background: linear-gradient(135deg, #A5B8C4, #8FA5B8);
        }

        .quick-action-item .title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .quick-action-item .desc {
            font-size: 11px;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* Tab Buttons */
        .tab-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-white);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: transparent;
        }

        .tab-btn:hover:not(.active) {
            background: var(--primary-bg);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .data-table th,
        .data-table td {
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-light);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover td {
            background: var(--primary-bg);
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-white);
            color: var(--text-primary);
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(196, 168, 154, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* Buttons */
        .btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-white);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--primary-bg);
        }

        .btn-danger {
            background: linear-gradient(135deg, #D4A5A5, #C98B8B);
            color: white;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg-white);
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-header {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-white);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 60px;
        }

        .calendar-day:hover {
            background: var(--primary-bg);
        }

        .calendar-day.today {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border-color: transparent;
        }

        .calendar-day.today .day-number {
            color: white;
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
        }

        .calendar-day .day-number {
            font-size: 15px;
            font-weight: 600;
        }

        .calendar-day .day-dots {
            display: flex;
            gap: 3px;
            margin-top: 4px;
        }

        .calendar-day .day-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1001;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-white);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-header .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: var(--bg-light);
            cursor: pointer;
            font-size: 16px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* Page Sections */
        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .main-content {
                width: 100vw;
            }

            .header {
                padding: 0 16px;
                padding-left: 60px;
            }

            .content-area {
                padding: 16px;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .calendar-grid {
                gap: 4px;
            }

            .calendar-day {
                min-height: 44px;
            }

            .calendar-day .day-number {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .quick-actions {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
            height: 100%;
        }

        .fade-in-full {
            animation: fadeIn 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 新建预约等表单页面，让 content-area 填满视口 */
        .content-area.form-page {
            overflow: hidden;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .badge-primary {
            background: var(--primary-bg);
            color: var(--primary-dark);
        }

        .badge-success {
            background: #E8F5E8;
            color: var(--success);
        }

        .badge-warning {
            background: #FFF5E8;
            color: var(--warning);
        }

        /* Schedule Table */
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule-table th,
        .schedule-table td {
            padding: 12px;
            border: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
        }

        .schedule-table th {
            background: var(--bg-light);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .schedule-table .staff-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .schedule-cell {
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .schedule-cell:hover {
            background: var(--primary-bg);
        }

        .schedule-cell .shift-tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        .schedule-cell .shift-morning {
            background: #FFF0E8;
            color: #C98B6B;
        }

        .schedule-cell .shift-full {
            background: #E8F0FF;
            color: #6B8FC9;
        }

        /* Member List Item */
        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-item:hover {
            background: var(--primary-bg);
        }

        .member-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .member-info {
            flex: 1;
            min-width: 0;
        }

        .member-info .name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .member-info .detail {
            font-size: 12px;
            color: var(--text-light);
        }

        .member-actions {
            display: flex;
            gap: 8px;
        }

        /* Image Upload */
        .image-upload {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .image-upload i {
            font-size: 32px;
            color: var(--primary-light);
            margin-bottom: 8px;
        }

        .image-upload p {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Style Gallery */
        .style-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .style-card {
            background: var(--bg-white);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s;
        }

        .style-card:hover {
            box-shadow: 0 4px 16px var(--shadow);
        }

        .style-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .style-card .style-info {
            padding: 12px;
        }

        .style-card .style-info h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .style-card .style-info p {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Link Copy */
        .link-copy-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .link-copy-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
        }

        .link-copy-box button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Analysis Cards */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .analysis-card {
            background: var(--bg-white);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 20px;
            text-align: center;
        }

        .analysis-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 8px 0;
        }

        .analysis-card .label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .analysis-card .sub {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 3000;

            transition: all 0.3s;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Sidebar overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 999;
        }

        .sidebar-overlay.active {

        /* Scrollbar for content */
        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }
    </style>
</head>

function showToast(message) {

function formatDate(date) {
    const d = new Date(date);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

function formatDateShort(date) {
    const d = new Date(date);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function getWeekDay(date) {
    const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return days[new Date(date).getDay()];
}

function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getMonthStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function getYearStr() {
    return String(new Date().getFullYear());
}

function formatDateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function navigateTo(page) {
    currentPage = page;
    window.location.hash = page;
    updateSidebarActive(page);
    renderPage(page);

}

function updateSidebarActive(page) {
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
    });
}

function updateHeader(title, actions = '') {
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('headerRight').innerHTML = `<span>${formatDate(new Date())} ${getWeekDay(new Date())}</span>${actions}`;
}

    const content = document.getElementById('contentArea');
    content.innerHTML = '';
    // 清除表单页面的特殊样式

    switch (page) {
        case 'dashboard': renderDashboard(content); break;

        case 'lottery-checkin': renderLotteryCheckin(content); break;
        case 'data-analysis': renderDataAnalysis(content); break;
        default: renderDashboard(content);
    }
}

window.switchDataTab = function(btn, type) {
    document.querySelectorAll('.tab-group .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const members = Store.get('members', []);
    const appointments = Store.get('appointments', []);
    const today = getTodayStr();
    const monthStr = getMonthStr();
    const yearStr = getYearStr();
    let revenue = 0, appCount = 0, completed = 0, newCustomers = 0;
    if (type === 'today') {
        const todayApps = appointments.filter(a => a.date === today);
        appCount = todayApps.length; completed = todayApps.filter(a => a.status === 'done').length;
        revenue = todayApps.filter(a => a.status === 'done').reduce((s, a) => s + a.amount, 0);
        newCustomers = todayApps.filter(a => a.isNew).length;
    } else if (type === 'month') {
        const monthApps = appointments.filter(a => a.date.startsWith(monthStr));
        appCount = monthApps.length; completed = monthApps.filter(a => a.status === 'done').length;
        revenue = monthApps.filter(a => a.status === 'done').reduce((s, a) => s + a.amount, 0);
        newCustomers = monthApps.filter(a => a.isNew).length;
    } else {
        const yearApps = appointments.filter(a => a.date.startsWith(yearStr));
        appCount = yearApps.length; completed = yearApps.filter(a => a.status === 'done').length;
        revenue = yearApps.filter(a => a.status === 'done').reduce((s, a) => s + a.amount, 0);
        newCustomers = yearApps.filter(a => a.isNew).length;
    }
    document.getElementById('dataStats').innerHTML = `
        <div class="stat-card"><div class="stat-label">营业额</div><div class="stat-value">¥${revenue}</div><div class="stat-sub">${type === 'today' ? '今日' : type === 'month' ? '本月' : '本年'}累计</div></div>
        <div class="stat-card"><div class="stat-label">预约数</div><div class="stat-value">${appCount}</div><div class="stat-sub">待到店 ${appCount - completed}</div></div>
        <div class="stat-card"><div class="stat-label">已完成</div><div class="stat-value">${completed}</div><div class="stat-sub">客单价 ¥${completed > 0 ? Math.round(revenue / completed) : 0}</div></div>
        <div class="stat-card"><div class="stat-label">新增会员</div><div class="stat-value">${newCustomers}</div><div class="stat-sub">总会员 ${members.length}</div></div>`;
};

window.handleStyleImageUpload = function(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) { document.getElementById('styleImage').value = e.target.result; showToast('图片已加载'); };
    reader.readAsDataURL(file);
};

window.saveStyle = function(editId) {
    const name = document.getElementById('styleName').value.trim();
    const desc = document.getElementById('styleDesc').value.trim();
    const image = document.getElementById('styleImage').value.trim();
    if (!name) { showToast('请输入款式名称'); return; }
    let styles = Store.get('styles', []);
    if (editId) { const idx = styles.findIndex(s => s.id === editId); if (idx >= 0) styles[idx] = { ...styles[idx], name, desc, image }; }
    else { styles.push({ id: Date.now(), name, desc, image }); }
    Store.set('styles', styles); closeModal('styleModal'); showToast('保存成功');
    renderStyleRecommend(document.getElementById('contentArea'));
};

};

function renderCalendar() {
    const year = currentCalendarMonth.getFullYear();
    const month = currentCalendarMonth.getMonth();
    document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDay = firstDay.getDay();
    const daysInMonth = lastDay.getDate();
    const appointments = Store.get('appointments', []);
    const today = getTodayStr();
    const grid = document.getElementById('calendarGrid');
    let html = '';
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    weekDays.forEach(d => { html += `<div class="calendar-day-header">${d}</div>`; });
    for (let i = 0; i < startDay; i++) html += '<div></div>';
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayApps = appointments.filter(a => a.date === dateStr);
        const isToday = dateStr === today;
        const hasEvent = dayApps.length > 0;
        html += `<div class="calendar-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}" onclick="showDayAppointments('${dateStr}')"><span class="day-number">${day}</span>${hasEvent ? `<div class="day-dots">${dayApps.slice(0, 3).map(() => '<span></span>').join('')}</div>` : ''}</div>`;
    }
    grid.innerHTML = html;
}

window.prevMonth = function() { currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() - 1); renderCalendar(); };
window.nextMonth = function() { currentCalendarMonth.setMonth(currentCalendarMonth.getMonth() + 1); renderCalendar(); };

window.showDayAppointments = function(dateStr) {
    const appointments = Store.get('appointments', []);
    const dayApps = appointments.filter(a => a.date === dateStr);
    document.getElementById('selectedDateTitle').textContent = `${formatDate(dateStr)} · ${dayApps.length}个预约`;

        container.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-day"></i><p>该日期暂无预约</p></div>`;

    container.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${dayApps.map(app => `

};

window.saveAppointment = function() {
    const name = document.getElementById('appName').value.trim();
    const project = document.getElementById('appProject').value;
    const date = document.getElementById('appDate').value;
    const time = document.getElementById('appTime').value;
    const phone = document.getElementById('appPhone').value.trim();
    const wechat = document.getElementById('appWechat').value.trim();
    const isNew = document.getElementById('appIsNew').value === 'yes';
    const platform = document.getElementById('appPlatform').value;
    const amount = parseFloat(document.getElementById('appAmount').value) || 0;
    const editId = document.getElementById('appEditId').value;
    if (!name || !project || !date || !time) { showToast('请填写必填项'); return; }
    let appointments = Store.get('appointments', []);
    if (editId) { const idx = appointments.findIndex(a => a.id == editId); if (idx >= 0) appointments[idx] = { ...appointments[idx], name, project, date, time, phone, wechat, isNew, platform, amount }; }
    else { appointments.push({ id: Date.now(), name, project, date, time, phone, wechat, isNew, platform, amount, status: 'pending' }); }
    Store.set('appointments', appointments); showToast(editId ? '预约已更新' : '预约已添加'); navigateTo('appointment');
};

window.saveMember = function(editId) {
    const name = document.getElementById('memberName').value.trim();
    const phone = document.getElementById('memberPhone').value.trim();
    const wechat = document.getElementById('memberWechat').value.trim();
    const discount = parseFloat(document.getElementById('memberDiscount').value);
    const recharge = parseFloat(document.getElementById('memberRecharge').value) || 0;
    const gift = parseFloat(document.getElementById('memberGift').value) || 0;
    if (!name) { showToast('请输入姓名'); return; }
    let members = Store.get('members', []);
    if (editId) {
        const idx = members.findIndex(m => m.id === editId);
        if (idx >= 0) {
            const old = members[idx];
            members[idx] = { ...old, name, phone, wechat, discount, recharge, gift, balance: recharge + gift - (old.recharge + (old.gift || 0) - old.balance) };
        }
    } else {
        members.push({ id: Date.now(), name, phone, wechat, discount, recharge, gift, balance: recharge + gift, consumptionCount: 0, records: [] });
    }
    Store.set('members', members); closeModal('memberModal'); showToast('保存成功'); renderMemberProfile(document.getElementById('contentArea'));
};

                </div>
            </div>

window.saveBalance = function(memberId) {
    const recharge = parseFloat(document.getElementById('editRecharge').value) || 0;
    const gift = parseFloat(document.getElementById('editGift').value) || 0;
    const manualBalance = document.getElementById('editBalance').value.trim();

    let members = Store.get('members', []);
    const idx = members.findIndex(m => m.id === memberId);
    if (idx >= 0) {
        const m = members[idx];
        // 计算已消费金额
        const totalCharged = m.recharge + (m.gift || 0);
        const consumed = totalCharged - m.balance;

        if (manualBalance !== '') {
            // 手动设定余额
            m.balance = parseFloat(manualBalance) || 0;
        } else {
            // 自动计算：新充值+新赠送 - 已消费
            m.balance = recharge + gift - consumed;
            if (m.balance < 0) m.balance = 0;
        }
        m.recharge = recharge;
        m.gift = gift;
        members[idx] = m;
        Store.set('members', members);
        showToast(`余额已更新，当前余额 ¥${m.balance}`);
        closeModal('balanceModal');
        renderMemberCard(document.getElementById('contentArea'));
    }
};

window.saveScheduleCell = function(dateStr, staffName) {
    const type = document.getElementById('shiftType').value;
    const time = document.getElementById('shiftTime').value;
    if (type === 'rest') { removeSchedule(dateStr, staffName); return; }
    let schedule = Store.get('schedule', {});
    if (!schedule[dateStr]) schedule[dateStr] = {};
    schedule[dateStr][staffName] = { shift: type, time };
    Store.set('schedule', schedule); closeModal('scheduleCellModal'); showToast('班次已设置');
    renderSchedule(document.getElementById('contentArea'));
};

window.removeSchedule = function(dateStr, staffName) {

};

function renderDataAnalysis(container) {

    const todayRevenue = todayApps.filter(a => a.status === 'done').reduce((s, a) => s + a.amount, 0);
    const monthRevenue = monthApps.filter(a => a.status === 'done').reduce((s, a) => s + a.amount, 0);

    container.innerHTML = `
        <div class="fade-in">

                <div class="stat-card"><div class="stat-label">会员总数</div><div class="stat-value">${members.length}</div><div class="stat-sub">总余额 ¥${members.reduce((s, m) => s + m.balance, 0)}</div></div>
            </div>

            <div class="card" style="margin-bottom:20px">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center"><h3>营收明细</h3><button class="btn btn-sm btn-primary" onclick="window.openAnalysisAddModal()"><i class="fas fa-plus"></i> 添加</button></div>
                <div class="card-body">
                    <div class="tab-group">
                        <button class="tab-btn active" onclick="switchAnalysisTab(this, 'today')">今日</button>
                        <button class="tab-btn" onclick="switchAnalysisTab(this, 'month')">本月</button>
                        <button class="tab-btn" onclick="switchAnalysisTab(this, 'year')">本年</button>
                    </div>
                    <div id="analysisTable">
                        ${renderAnalysisTable(todayApps)}

                <div class="card-body">
                    <table class="data-table">
                        <thead><tr><th>统计项</th><th>今日</th><th>本月</th><th>本年</th></tr></thead>

                            <tr><td>预约数</td><td>${todayApps.length}</td><td>${monthApps.length}</td><td>${yearApps.length}</td></tr>
                            <tr><td>已完成</td><td>${todayApps.filter(a => a.status === 'done').length}</td><td>${monthApps.filter(a => a.status === 'done').length}</td><td>${yearApps.filter(a => a.status === 'done').length}</td></tr>

                            <tr><td>新客</td><td>${todayApps.filter(a => a.isNew).length}</td><td>${monthApps.filter(a => a.isNew).length}</td><td>${yearApps.filter(a => a.isNew).length}</td></tr>

function renderAnalysisTable(apps) {
    if (apps.length === 0) return '<div class="empty-state"><p>暂无数据</p></div>';
    const staffList = Store.get('staff', []).map(s => s.name);
    return `<div class="table-wrapper"><table class="data-table"><thead><tr><th>日期</th><th>顾客</th><th>项目</th><th>人员</th><th>平台</th><th>金额</th><th>状态</th><th>操作</th></tr></thead><tbody>${apps.map(a => `<tr><td>${a.date} ${a.time}</td><td>${a.name}</td><td>${a.project}</td><td>${a.staff || '-'}</td><td>${a.platform}</td><td>¥${a.amount}</td><td><span class="badge ${a.status === 'done' ? 'badge-success' : 'badge-primary'}">${a.status === 'done' ? '已完成' : '待处理'}</span></td><td style="white-space:nowrap"><button class="btn btn-sm btn-secondary" onclick="window.openAnalysisEditModal(${a.id})">编辑</button><button class="btn btn-sm ${a.status === 'done' ? 'btn-secondary' : 'btn-primary'}" onclick="window.toggleAnalysisStatus(${a.id})" style="margin-left:4px">${a.status === 'done' ? '待处理' : '完成'}</button><button class="btn btn-sm btn-danger" onclick="window.deleteAnalysisItem(${a.id})" style="margin-left:4px">删除</button></td></tr>`).join('')}</tbody></table></div>`;
}

window.switchAnalysisTab = function(btn, type) {
    document.querySelectorAll('.tab-group .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    window._analysisTab = type;
    const appointments = Store.get('appointments', []);
    const today = getTodayStr();
    const monthStr = getMonthStr();
    const yearStr = getYearStr();
    let apps = [];
    if (type === 'today') apps = appointments.filter(a => a.date === today);
    else if (type === 'month') apps = appointments.filter(a => a.date.startsWith(monthStr));
    else apps = appointments.filter(a => a.date.startsWith(yearStr));
    document.getElementById('analysisTable').innerHTML = renderAnalysisTable(apps);
};

window.toggleAnalysisStatus = function(id) {
    let appointments = Store.get('appointments', []);
    const idx = appointments.findIndex(a => a.id === id);
    if (idx >= 0) {
        appointments[idx].status = appointments[idx].status === 'done' ? 'pending' : 'done';
        Store.set('appointments', appointments);
        showToast(appointments[idx].status === 'done' ? '已标为完成' : '已标为待处理');
        // 刷新当前tab
        const type = window._analysisTab || 'today';
        const today = getTodayStr();
        const monthStr = getMonthStr();
        const yearStr = getYearStr();
        let apps = [];
        if (type === 'today') apps = appointments.filter(a => a.date === today);
        else if (type === 'month') apps = appointments.filter(a => a.date.startsWith(monthStr));
        else apps = appointments.filter(a => a.date.startsWith(yearStr));
        document.getElementById('analysisTable').innerHTML = renderAnalysisTable(apps);
        // 刷新营收卡片
        renderDataAnalysis(document.getElementById('contentArea'));
    }
};

};

window.saveAnalysisEdit = function(id) {
    const name = document.getElementById('aeName').value.trim();
    const project = document.getElementById('aeProject').value;
    const date = document.getElementById('aeDate').value;
    const time = document.getElementById('aeTime').value;
    const staff = document.getElementById('aeStaff').value;
    const platform = document.getElementById('aePlatform').value;
    const amount = parseFloat(document.getElementById('aeAmount').value) || 0;
    const status = document.getElementById('aeStatus').value;
    if (!name) { showToast('请输入姓名'); return; }
    let appointments = Store.get('appointments', []);
    const idx = appointments.findIndex(a => a.id === id);
    if (idx >= 0) {
        appointments[idx] = { ...appointments[idx], name, project, date, time, staff, platform, amount, status };
        Store.set('appointments', appointments);
        showToast('已保存');
        closeModal('analysisEditModal');
        renderDataAnalysis(document.getElementById('contentArea'));
    }
};

window.saveAnalysisAdd = function() {
    const name = document.getElementById('aaName').value.trim();
    const project = document.getElementById('aaProject').value;
    const date = document.getElementById('aaDate').value;
    const time = document.getElementById('aaTime').value;
    const staff = document.getElementById('aaStaff').value;
    const platform = document.getElementById('aaPlatform').value;
    const amount = parseFloat(document.getElementById('aaAmount').value) || 0;
    const status = document.getElementById('aaStatus').value;
    if (!name) { showToast('请输入姓名'); return; }
    let appointments = Store.get('appointments', []);
    const newId = appointments.length > 0 ? Math.max(...appointments.map(a => a.id)) + 1 : 1;
    appointments.push({ id: newId, name, project, date, time, staff, platform, amount, status, phone: '', wechat: '', isNew: false });
    Store.set('appointments', appointments);
    showToast('已添加');
    closeModal('analysisAddModal');
    renderDataAnalysis(document.getElementById('contentArea'));
};

window.deleteAnalysisItem = function(id) {
    if (!confirm('确定要删除这条记录吗？')) return;
    let appointments = Store.get('appointments', []);
    appointments = appointments.filter(a => a.id !== id);
    Store.set('appointments', appointments);
    showToast('已删除');
    renderDataAnalysis(document.getElementById('contentArea'));
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', function() {
    initDefaultData();

    // Mobile menu toggle
    document.getElementById('mobileMenuToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    });

    document.getElementById('sidebarOverlay').addEventListener('click', closeMobileMenu);

    // Hash-based routing
    function handleHash() {
        const hash = window.location.hash.slice(1) || 'dashboard';
        if (hash !== currentPage) {
            currentPage = hash;
            updateSidebarActive(hash);
            renderPage(hash);
        }
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();
});

<script>
// 注销旧的 Service Worker（避免旧缓存导致打不开）
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(reg) { reg.unregister(); });
    });
}
</script>
